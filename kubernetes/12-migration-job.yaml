apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
  name: db-migration
  namespace: easyshop
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    spec:
      containers:
      - name: migration
        image: manthan0501/easyshop-migration:6
        imagePullPolicy: Always
        env:
        - name: MONGODB_URI
          value: "mongodb://mongodb-service:27017/easyshop"
      restartPolicy: Never
